name: Deploy Clean V2 Portal

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "public/**"
      - "Dockerfile"
      - "nginx.conf"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-v2-portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: slh-tms-v2-portal-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: slh-tms-prod-rg
      ACR: slhtmsacrprod
      APP: slh-tms-v2-portal-prod
      IMAGE: slh-tms-v2-portal

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: 5f07805f-dbc2-4068-8d2f-06569635fc0c
          tenant-id: 5aec48a1-c3c7-4cfd-a073-b38ae50041b1
          subscription-id: 29d5b52a-5b9f-4b5a-9495-892f1c2a30f3

      - name: Build clean V2 portal
        run: |
          set -euo pipefail
          az acr build             --registry "$ACR"             --image "$IMAGE:${GITHUB_SHA}"             --build-arg VITE_API_BASE_URL=/tms-api             --build-arg VITE_ENTRA_TENANT_ID=5aec48a1-c3c7-4cfd-a073-b38ae50041b1             --build-arg VITE_ENTRA_CLIENT_ID=b4d086ae-6e9d-4578-8861-e61410127359             --build-arg VITE_ENTRA_API_SCOPE=api://497f6ea5-9753-43ee-8ccf-afaa0a3869c2/Tms.Access             --build-arg VITE_AZURE_MAPS_CLIENT_ID=58e0a4b4-b8e9-42e9-89cc-361ba0f33a5c             .

      - name: Deploy clean V2 portal
        run: |
          set -euo pipefail
          az containerapp update             --name "$APP"             --resource-group "$RG"             --image "$ACR.azurecr.io/$IMAGE:${GITHUB_SHA}"             --min-replicas 1             --max-replicas 3             --output none

      - name: Verify portal
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)"
          for attempt in {1..60}; do
            code="$(curl -sS -o /tmp/index.html -w '%{http_code}' --max-time 15 "https://$fqdn/" || true)"
            if test "$code" = "200"; then
              echo "Clean V2 portal ready at https://$fqdn"
              exit 0
            fi
            sleep 10
          done
          exit 1
