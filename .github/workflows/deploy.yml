name: Deploy SLH TMS Web

# Deploy only after the CI build, unit tests and E2E have passed on main, so a broken
# change can no longer reach the live site while its checks are still running.
on:
  workflow_run:
    workflows: ["CI - Build, Test and E2E Portal"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slh-tms-web-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build React/Vite frontend
        env:
          VITE_API_BASE_URL: https://slh-tms-api-prod.azurewebsites.net
          VITE_ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: b4d086ae-6e9d-4578-8861-e61410127359
          VITE_ENTRA_API_SCOPE: api://497f6ea5-9753-43ee-8ccf-afaa0a3869c2/Tms.Access
          VITE_AZURE_MAPS_CLIENT_ID: ${{ vars.AZURE_MAPS_CLIENT_ID }}
        run: pnpm build
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
      - name: Verify portal and API health
        run: |
          set -euo pipefail
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://tms.lyonshaulage.com/)" = "200"
          health="$(curl -fsS https://slh-tms-api-prod.azurewebsites.net/api/v1/health)"
          echo "$health" | grep -q '"status":"healthy"'
          echo "API health verified directly against the Azure API origin."
