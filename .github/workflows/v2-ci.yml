name: V2 CI

on:
  push:
    branches: [ "v2/foundation" ]
  pull_request:
    branches: [ "v2/foundation" ]

jobs:
  build-v2-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
