name: V2 Baseline CI

on:
  push:
    branches: [ "v2/foundation", "v2/baseline-audit", "v2/master-data-package" ]
  pull_request:
    branches: [ "v2/foundation", "v2/baseline-audit" ]

jobs:
  build-v2-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Architecture guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "/planning" src --include='*.ts' --include='*.tsx'
          ! grep -R "PlanningPage" src --include='*.ts' --include='*.tsx'
          ! grep -R "PalletControlPage" src --include='*.ts' --include='*.tsx'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
