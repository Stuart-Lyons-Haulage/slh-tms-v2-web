server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text assets at the edge. Hashed Vite assets remain immutable and
  # are cached for a year, while HTML/service-worker entry points stay fresh.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/vnd.apple.mpegurl
    image/svg+xml
    text/css
    text/plain
    text/xml;

  # Planner JSON uploads must use the source-line importer. It reapplies run
  # resources and pallet totals on re-import and rebuilds all collections
  # before the delivery stops.
  location = /tms-api/api/v1/planning/import-plan {
    proxy_pass https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io/api/v1/planning/import-source-plan;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io;
    proxy_set_header Host slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
  }

  location /tms-api/ {
    proxy_pass https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io;
    proxy_set_header Host slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-TV-Display-Key $http_x_tv_display_key;
    proxy_set_header X-TMS-TV-Key $http_x_tms_tv_key;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /release.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~ ^/(tv|operations-wallboard/tv|live-runs/tv)$ {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
